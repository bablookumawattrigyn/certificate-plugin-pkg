# Publish @dikshatrigyn/certificate-plugin to GitLab npm registry on version tags.

stages:
  - test
  - publish

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"

.default-node:
  image: node:20-alpine
  before_script:
    - npm ci

build:
  extends: .default-node
  stage: test
  script:
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

publish-npm:
  extends: .default-node
  stage: publish
  script:
    - npm run build
    - |
      echo "@dikshatrigyn:registry=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/" >> .npmrc
      echo "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}" >> .npmrc
    - npm publish
  rules:
    - if: $CI_COMMIT_TAG
